<!-- ============================================================
     ASISTENTE SMART SEAWOLF — proactivo + perfilado de venta
     Endpoint: https://agente.sw-st.net/asistente (Nemotron free -> DeepSeek flash)
     ============================================================ -->
<style>
#swBtn{position:fixed;right:20px;bottom:20px;z-index:9998;background:var(--accent,#00d4aa);color:#04140f;border:none;border-radius:30px;padding:14px 20px;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit;box-shadow:0 10px 40px rgba(0,212,170,.35);transition:transform .2s}
#swBtn:hover{transform:translateY(-2px)}
#swChat{position:fixed;right:20px;bottom:20px;width:378px;max-width:93vw;height:548px;max-height:82vh;background:var(--card,#151515);border:1px solid var(--border,#232323);border-radius:16px;z-index:9999;display:none;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.62);font-family:inherit}
#swChat.on{display:flex}
#swChat .sw-h{background:var(--bg,#0a0a0a);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border,#232323)}
#swChat .sw-tit{font-size:14px;font-weight:700;color:var(--text,#f0f0f0)}
#swChat .sw-st{font-size:10.5px;color:var(--accent,#00d4aa)}
#swChat .sw-x{background:transparent;border:none;color:var(--muted,#8b8b8b);font-size:18px;cursor:pointer}
#swMsgs{flex:1;overflow-y:auto;padding:14px}
.sw-m{margin:8px 0;max-width:86%;font-size:13.5px;line-height:1.45;padding:10px 13px;border-radius:13px;color:var(--text,#f0f0f0)}
.sw-m.bot{background:var(--surface,#0d0d0d);border:1px solid var(--border,#232323)}
.sw-m.me{background:var(--accent,#00d4aa);color:#04140f;margin-left:auto}
.sw-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.sw-chip{background:transparent;border:1px solid var(--accent,#00d4aa);color:var(--accent,#00d4aa);border-radius:20px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.sw-chip:hover{background:var(--accent,#00d4aa);color:#04140f}
#swForm{display:flex;border-top:1px solid var(--border,#232323)}
#swInp{flex:1;background:transparent;border:none;color:var(--text,#f0f0f0);padding:13px;font-size:13.5px;outline:none;font-family:inherit}
#swForm button{background:var(--accent,#00d4aa);border:none;color:#04140f;font-weight:800;padding:0 17px;cursor:pointer}
#swChat.pop{animation:swpop .32s ease}
@keyframes swpop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
</style>

<button id="swBtn" aria-label="Abrir asistente de Seawolf Studio">🐺 ¿Te ayudo?</button>
<div id="swChat" role="dialog" aria-label="Asistente de Seawolf Studio">
  <div class="sw-h"><div><div class="sw-tit">🐺 Asistente Seawolf</div><div class="sw-st">● en línea · respondo al instante</div></div><button class="sw-x" id="swX" aria-label="Cerrar">✕</button></div>
  <div id="swMsgs" aria-live="polite"></div>
  <form id="swForm"><input id="swInp" placeholder="Escribe tu mensaje..." autocomplete="off"><button type="submit" aria-label="Enviar">➤</button></form>
</div>

<script>
(function () {
  var EP = "https://agente.sw-st.net/asistente";
  var PROMPT = [
    "Eres el asistente virtual de Seawolf Studio, una agencia de sistemas e IA que trabaja como un solo organismo.",
    "Hablas en espanol, coloquial, cercano y BREVE (maximo 3 frases). Nunca uses jerga tecnica ni la palabra 'jauria'.",
    "Tu OBJETIVO es entender que necesita el visitante y guiarlo a contratar. Productos y servicios:",
    "(1) SmartWeb: pagina web con su propio asistente de IA que atiende clientes 24/7;",
    "(2) SmartShop: tienda en linea para vender productos;",
    "(3) SmartCourse: cursos o contenido digital para vender;",
    "(4) Automatizaciones: que su negocio haga tareas solo (responder, agendar, cobrar);",
    "(5) Agente de IA: atiende, filtra y organiza todo lo del negocio.",
    "Flujo: saluda, pregunta por su negocio y su mayor dolor, sugiere el producto que mejor encaje,",
    "y cierra invitando a escribir por WhatsApp al +57 312 533 0127 o a dejar sus datos. Nunca inventes precios:",
    "di que se cotiza segun lo que necesite. Si no sabes algo, ofrece contacto humano."
  ].join(" ");
  var chat = document.getElementById('swChat'), msgs = document.getElementById('swMsgs'),
      inp = document.getElementById('swInp'), btn = document.getElementById('swBtn');
  var opened = false, greeted = false;

  function add(t, cls) {
    var d = document.createElement('div'); d.className = 'sw-m ' + cls; d.textContent = t;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
  }
  function chips(arr) {
    var w = document.createElement('div'); w.className = 'sw-chips';
    arr.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'sw-chip'; b.type = 'button'; b.textContent = c;
      b.onclick = function () { w.remove(); send(c); };
      w.appendChild(b);
    });
    msgs.appendChild(w); msgs.scrollTop = msgs.scrollHeight;
  }
  function open(pop) {
    chat.classList.add('on'); if (pop) chat.classList.add('pop');
    opened = true; setTimeout(function () { inp.focus(); }, 120);
  }
  function greet() {
    if (greeted) return; greeted = true;
    add('¡Hola! 👋 Soy el asistente de Seawolf Studio. Ayudamos a que tu negocio trabaje solo con sistemas e IA.', 'bot');
    add('¿Qué te trae por acá? Cuéntame de tu negocio y te digo por dónde empezar 👇', 'bot');
    chips(['Quiero una página web', 'Quiero vender en línea', 'Automatizar mi negocio', 'Solo estoy mirando']);
  }
  function send(text) {
    text = (text || '').trim(); if (!text) return;
    add(text, 'me'); inp.value = ''; var b = add('…', 'bot');
    fetch(EP, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: 'sw-st-landing', prompt: PROMPT, msg: text }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { b.textContent = d.reply || 'Escríbenos por WhatsApp al +57 312 533 0127 y te atendemos ya.'; msgs.scrollTop = msgs.scrollHeight; })
      .catch(function () { b.textContent = 'Escríbenos por WhatsApp al +57 312 533 0127 y te atendemos enseguida. 🙂'; });
  }
  btn.onclick = function () { chat.classList.contains('on') ? chat.classList.remove('on') : (open(true), greet()); };
  document.getElementById('swX').onclick = function () { chat.classList.remove('on'); };
  document.getElementById('swForm').addEventListener('submit', function (e) { e.preventDefault(); send(inp.value); });

  // PROACTIVO: sale solo a ofrecer ayuda
  setTimeout(function () { if (!opened) { open(true); greet(); } }, 11000);
  // exit-intent (escritorio) y scroll profundo
  document.addEventListener('mouseleave', function (e) { if (e.clientY < 6 && !opened) { open(true); greet(); } });
  var fired = false;
  window.addEventListener('scroll', function () {
    if (fired || opened) return;
    var p = (window.scrollY + window.innerHeight) / document.body.scrollHeight;
    if (p > 0.55) { fired = true; open(true); greet(); }
  });
})();
</script>

*{box-sizing:border-box}

.scroll{max-height:430px;overflow:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:12.5px}
th{position:sticky;top:0;background:var(--card);color:var(--accent);font-size:10.5px;text-transform:uppercase;z-index:2}
tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}

.pth{color:var(--muted-foreground);word-break:break-all;font-size:11.5px}
.tag{font-size:10px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted-foreground);white-space:nowrap}
.foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0 4px;margin-top:8px;border-top:1px solid var(--border)}
.foot .tot{font-weight:700}
.foot .tot b{color:var(--accent)}

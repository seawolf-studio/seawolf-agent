<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #121E1E;
        font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      #root { width: 100%; height: 100%; position: relative; }
      .bg { position: absolute; inset: 0; background:
        radial-gradient(70% 50% at 50% 30%, rgba(76,232,231,0.12), transparent 70%),
        radial-gradient(60% 40% at 82% 82%, rgba(72,232,216,0.09), transparent 70%),
        linear-gradient(160deg, #0B1414 0%, #121E1E 55%, #0A1212 100%); }
      .grid { position: absolute; inset: 0; opacity: .12;
        background-image: linear-gradient(rgba(76,232,231,.35) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(76,232,231,.35) 1px, transparent 1px);
        background-size: 90px 90px;
        -webkit-mask-image: radial-gradient(72% 55% at 50% 42%, #000 30%, transparent 78%); }
      .wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
      .logo { width: 560px; height: auto; display: block; }
      .rule { width: 0; height: 4px; margin: 22px 0 30px; border-radius: 3px;
        background: linear-gradient(90deg, #4CE8E7, #48E8D8); }
      .tag { margin-top: 24px; color: #bfe9e8; font-size: 32px; font-weight: 500;
        letter-spacing: .01em; max-width: 980px; line-height: 1.35; }
      .pill { margin-top: 46px; display: inline-flex; gap: 22px; }
      .pill span { color: #48E8D8; border: 2px solid rgba(76,232,231,.4);
        padding: 12px 26px; border-radius: 999px; font-size: 29px; font-weight: 600; letter-spacing: .04em; }
      .foot { position: absolute; bottom: 104px; left: 0; right: 0; text-align: center;
        color: rgba(255,255,255,.55); font-size: 34px; letter-spacing: .26em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10"
         data-width="1080" data-height="1920">
      <div class="bg clip" id="bg" data-start="0" data-duration="10" data-track-index="0"></div>
      <div class="grid clip" id="grid" data-start="0" data-duration="10" data-track-index="0"></div>

      <div class="wrap" id="wrap">
        <img class="logo" id="logo" src="./assets/logo.png" alt="Seawolf Studio" />
        <div class="rule" id="rule"></div>
        <div class="tag" id="tag">Smart Webs · Inteligencia Artificial · Contenido</div>
        <div class="pill" id="pill"><span>Agentes</span><span>Automatización</span><span>Marca</span></div>
      </div>

      <div class="foot" id="foot">SW-ST.NET</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: .84, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "power3.out" }, 0.15);
      tl.fromTo("#rule", { width: 0 }, { width: 220, duration: .7, ease: "power2.out" }, 0.95);
      tl.fromTo("#tag",  { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .8, ease: "power2.out" }, 1.25);
      tl.fromTo("#pill span", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, stagger: .12, ease: "power2.out" }, 1.9);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: .8 }, 2.4);
      tl.to(".wrap", { opacity: 0, y: -30, duration: .8, ease: "power2.in" }, 9.0);
      tl.to("#foot", { opacity: 0, duration: .5 }, 9.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mesa de Guerra · Seawolf</title>
<style>
  :root{--bg:#0B1414;--bg2:#121E1E;--cyan:#4CE8E7;--aqua:#48E8D8;--ink:#E8FBFB;--dim:#7FA3A3;
        --line:rgba(76,232,231,.16);--card:rgba(255,255,255,.028);--gold:#FFD166}
  *{box-sizing:border-box}
  body{margin:0;padding:18px 20px 24px;width:100%;
    background:radial-gradient(1100px 520px at 6% -10%,rgba(76,232,231,.13),transparent 60%),
               radial-gradient(900px 480px at 100% 0%,rgba(255,209,102,.09),transparent 60%),
               linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink);font-family:var(--font,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);min-height:100vh}
  .hd{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:6px}
  .ttl{font-size:23px;font-weight:900;letter-spacing:.4px;
       background:linear-gradient(92deg,var(--cyan),var(--aqua) 55%,#fff 140%);
       -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11.5px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
        font-size:11px;font-weight:800;letter-spacing:1.2px;background:rgba(76,232,231,.09);
        border:1px solid var(--line);color:var(--cyan)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
  .barra{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:12px 0 16px}

  .chat{display:flex;flex-direction:column;gap:14px;max-width:100%}
  .msg{display:flex;gap:11px;align-items:flex-start;max-width:88%}
  .msg.mine{margin-left:auto;flex-direction:row-reverse}
  .av{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:19px;
      background:linear-gradient(140deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line)}
  .burbuja{border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--card);position:relative}
  .msg.bellion .burbuja{background:linear-gradient(120deg,rgba(76,232,231,.12),rgba(0,0,0,.2));border-color:rgba(76,232,231,.4)}
  .msg.mine .burbuja{background:linear-gradient(120deg,rgba(255,209,102,.13),rgba(0,0,0,.2));border-color:rgba(255,209,102,.4)}
  .msg.sombra .burbuja{background:rgba(0,0,0,.24)}
  .cab{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;flex-wrap:wrap}
  .nom{font-weight:800;font-size:13px}
  .rol{font-size:10px;color:var(--dim);letter-spacing:.6px}
  .hora{font-size:10px;color:var(--dim);margin-left:auto}
  .txt{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .vac{color:var(--dim);font-size:12px;text-align:center;padding:26px;border:1px dashed var(--line);border-radius:14px}

  h2{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:22px 0 11px;
     display:flex;align-items:center;gap:9px}
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .squad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .sh{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
      border-radius:13px;padding:10px;cursor:pointer;transition:.18s}
  .sh:hover{transform:translateY(-2px);border-color:rgba(76,232,231,.5);background:rgba(76,232,231,.07)}
  .sh .av{width:34px;height:34px;flex:0 0 34px;font-size:16px;border-radius:10px}
  .sh .n{font-weight:800;font-size:12.5px}
  .sh .r{font-size:9.5px;color:var(--dim)}
  .foot{margin-top:16px;font-size:10.5px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
  .sus{display:flex;flex-direction:column;gap:10px}
  .sw{border:1px dashed rgba(167,139,250,.5);border-radius:13px;padding:11px 13px;
      background:linear-gradient(120deg,rgba(167,139,250,.10),rgba(0,0,0,.25));position:relative}
  .sw .cab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .sw .nom{font-weight:800;font-size:12.5px}
  .sw .flecha{font-size:11px;color:var(--dim)}
  .sw .hora{font-size:10px;color:var(--dim);margin-left:auto}
  .sw .txt{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .sw.sombra{border-style:solid;border-color:rgba(167,139,250,.35)}
  .candado{font-size:9.5px;font-weight:800;letter-spacing:1px;color:#C4B5FD;background:rgba(167,139,250,.14);
           padding:3px 8px;border-radius:999px;display:inline-block;margin-bottom:8px}
  .mi{border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(0,0,0,.22);margin-bottom:13px}
  .mi .top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px}
  .mi .ti{font-weight:800;font-size:14px}
  .mi .pill{font-size:9.5px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:999px;
            background:rgba(255,194,75,.16);color:var(--amber)}
  .mi .pill.ok{background:rgba(91,229,138,.16);color:var(--green)}
  .turno{display:flex;gap:11px;padding:10px 0;border-top:1px dashed rgba(76,232,231,.13)}
  .turno .num{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;
              background:rgba(76,232,231,.13);color:var(--cyan);border:1px solid var(--line)}
  .turno .cuerpo{flex:1;min-width:0}
  .turno .ord{font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .turno .ord b{color:var(--gold);font-weight:700}
  .turno .resp{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
               background:rgba(255,255,255,.03);border-left:2px solid var(--aqua);padding:8px 11px;border-radius:7px}
  .mision-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mb{cursor:pointer;font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;
      background:rgba(76,232,231,.10);border:1px solid var(--line);color:var(--cyan)}
  .mb:hover{background:rgba(76,232,231,.2)}
  /* ====== REENCAUCE — capa vistosa ====== */
  .rc{position:relative;border-radius:18px;padding:18px 20px;margin:4px 0 18px;overflow:hidden;
      border:1px solid rgba(255,107,107,.55);
      background:linear-gradient(120deg,rgba(255,107,107,.16),rgba(255,209,102,.10),rgba(167,139,250,.12));
      box-shadow:0 0 0 1px rgba(255,107,107,.25),0 18px 60px -22px rgba(255,107,107,.75)}
  .rc::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(255,107,107,.30),transparent 40%);animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rc>*{position:relative}
  .rc .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:2px;
           color:#FFD7D7;background:rgba(255,107,107,.22);border:1px solid rgba(255,107,107,.5);
           padding:5px 12px;border-radius:999px;text-transform:uppercase}
  .rc .big{font-size:19px;font-weight:900;margin:11px 0 6px;color:#fff;text-shadow:0 2px 22px rgba(255,107,107,.55)}
  .rc .quote{font-size:14px;color:#FFE7E7;font-style:italic;opacity:.95}
  .antes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
  .ao{padding:9px 15px;border-radius:12px;font-weight:800;font-size:13.5px}
  .ao.old{background:rgba(255,255,255,.06);color:#C9D6D6;text-decoration:line-through;text-decoration-color:rgba(255,107,107,.85);border:1px solid rgba(255,255,255,.10)}
  .ao.new{background:linear-gradient(120deg,rgba(255,107,107,.30),rgba(255,209,102,.24));color:#fff;border:1px solid rgba(255,107,107,.6);
          box-shadow:0 0 26px -6px rgba(255,107,107,.9);animation:latido 1.7s infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .flech{font-size:20px;color:#FFB4B4;font-weight:900}
  .prop{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .pc{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;padding:7px 13px;border-radius:11px;
      background:rgba(91,229,138,.13);border:1px solid rgba(91,229,138,.45);color:#B9F5DC}
  .pc b{font-weight:900}
  .badge-rc{font-size:9.5px;font-weight:900;letter-spacing:1px;padding:3px 9px;border-radius:999px;
            background:linear-gradient(120deg,rgba(255,107,107,.35),rgba(255,209,102,.3));color:#fff;
            border:1px solid rgba(255,107,107,.55);animation:latido 1.9s infinite}
</style>
</head>
<body>
  <div class="hd">
    <div>
      <div class="ttl">🐺 MESA DE GUERRA</div>
      <div class="sub">Cuarto de guerra · Bellion y el escuadrón · <span id="gen"></span></div>
    </div>
    <div class="live"><span class="dot"></span> EN VIVO</div>
  </div>
  <div class="barra"></div>

  <div id="rc"></div>

  <div class="chat" id="chat"></div>

  <h2>♻️ Misiones en turnos — corregir a mitad de camino</h2>
  <div id="mis"></div>

  <h2>🔒 Susurros — solo usted y la sombra</h2>
  <div class="sus" id="sus"></div>

  <h2>Convocar a una sombra</h2>
  <div class="squad" id="squad"></div>

  <div class="foot" id="foot"></div>

<script>
const D = {"mensajes": [{"de": "monarca", "texto": "Muchachos, quiero el Cuarto de Guerra: UNA mesa donde yo les hable a todos, ustedes me respondan con su nombre, yo vea cada detalle mientras pasa, y pueda corregir a cualquiera a mitad de camino — o hablar aparte con uno solo.", "hora": "21:10", "n": "Monarca", "r": "Key · Seawolf Studio", "i": "👑", "c": "#FFD166"}, {"de": "bellion", "texto": "Recibido, mi señor. 🐺\nTraducción: mesa unificada + turnos + interrupción. Fase 1 = la mesa donde todos hablan con nombre. Ya está en pie — esto que ve ES la Fase 1.\nReparto: Jima evalúa el enganche técnico; Igris propone nombre y lema. Los convoco.", "hora": "21:10", "n": "Bellion", "r": "Gran Comandante", "i": "🐺", "c": "#4CE8E7"}, {"de": "jima", "texto": "Conecta la API externa mediante webhook con idempotencia (dedupe token) y reintentos con backoff. Usa variables de entorno para el token, no hardcodees. Verifica con una llamada real: 200 OK + payload esperado.", "hora": "21:10", "n": "Jima", "r": "Automatización", "i": "⚙️", "c": "#8FD6FF"}, {"de": "igris", "texto": "Nombre: LA GUARIDA (o La Madriguera del Lobo).\nLema de guerra: El lobo no caza solo: caza en sombras.\nTres frases, sin relleno, listo para grabar en la puerta.", "hora": "21:10", "n": "Igris", "r": "Copywriting", "i": "✍️", "c": "#A78BFA"}, {"de": "bellion", "texto": "Escuchados, mi señor. Jima: el enganche va por .env + verificacion real (coincide con nuestra doctrina de secretos). Igris: LA GUARIDA, y el lema nos define. Fase 1 EN PIE: la mesa existe, las sombras hablan con su nombre, y usted puede convocar a cualquiera desde abajo.", "hora": "21:10", "n": "Bellion", "r": "Gran Comandante", "i": "🐺", "c": "#4CE8E7"}, {"de": "bellion", "texto": "Igris respondio al susurro privado: el lema paso de solemne a picante con las dos palabras exigidas al oido. Fase 2 VERIFICADA: el susurro cambia de verdad lo que la sombra produce.", "hora": "22:13", "n": "Bellion", "r": "Gran Comandante", "i": "🐺", "c": "#4CE8E7"}, {"de": "monarca", "texto": "El cliente ya no lo quiere azul y en espanol. Ahora lo quiere ROJO y en INGLES. Reencaucen todo el trabajo.", "hora": "22:51", "cambio": true, "antes": "Azul · Español", "despues": "Rojo · Inglés", "n": "Monarca", "r": "Key · Seawolf Studio", "i": "👑", "c": "#FFD166"}], "susurros": [{"de": "monarca", "para": "igris", "texto": "Mi caballero Igris: no me termina de gustar ese lema tan solemne. Hazmelo mas jocoso y con chispa picante, y asegurate de incluir EXACTAMENTE estas dos palabras: 'muerde' y 'sin permiso'.", "hora": "22:13", "n": "Monarca", "c": "#FFD166", "i": "👑", "pn": "Igris", "pc": "#A78BFA", "pi": "✍️"}, {"de": "igris", "para": "monarca", "texto": "Palabras que muerden sin permiso.", "hora": "22:13", "n": "Igris", "c": "#A78BFA", "i": "✍️", "pn": "Monarca", "pc": "#FFD166", "pi": "👑"}], "misiones": [{"id": "m1", "titulo": "App multiplataforma que canta la hora", "sombra": "jima", "sesion": "local-2522882acc1827c5fc538f2d503480b439314803bc6c70a573c1bfaedc362e06", "turnos": [{"n": 1, "quien": "monarca", "instruccion": "En maximo 3 lineas, se directo y sin preambulos: propuesta tecnica para una app multiplataforma que cada hora cante la hora con un ritmo distinto.", "salida": "\u001b[0m\n\u001b[38;2;255;248;220mApp multiplataforma con cron por hora, cada vez con ritmo aleatorio desde lista predefinida (10 estilos). Usa Web Audio API para generar sonido en tiempo real, sin almacenar archivos. Notifica via push con notificación de audio (solo si permiso).\u001b[0m", "hora": "22:33"}, {"n": 2, "quien": "monarca", "instruccion": "CORRECCION DEL MONARCA: olvida el azar. Quiero que los ritmos se elijan SEGUN LA HORA DEL DIA, no al azar. Dime en 3 lineas EXACTAMENTE que cambia respecto a tu propuesta anterior.", "salida": "\u001b[0m\n\u001b[38;2;255;248;220mCambios: el ritmo se elige por hora del día (ej: 6-9 AM: alegre, 12-2 PM: bailable, 6-10 PM: lento). Lista de ritmos por franja horaria está codificada en un JSON de mapeo. El cron ejecuta el mismo flujo, pero el ritmo se selecciona por hora actual, no aleatorio.\u001b[0m", "hora": "22:33"}, {"n": 3, "quien": "monarca", "instruccion": "Aplica la directiva vigente a tu propuesta anterior. Dime en 2 lineas que cambia en el color y en el idioma.", "salida": "\u001b[0m\n\u001b[38;2;255;248;220mCambios: el color de la interfaz es rojo (#B30000) en vez de azul; el idioma del sistema es inglés (en-US), con todos los mensajes y etiquetas en inglés.\u001b[0m", "hora": "22:51"}], "estado": "esperando tu correccion", "reencauzada": true, "directiva": "El cliente ya no lo quiere azul y en espanol. Ahora lo quiere ROJO y en INGLES. Reencaucen todo el trabajo.", "n": "Jima", "c": "#8FD6FF", "i": "⚙️", "r": "Automatización"}], "cambios": [{"id": "c1", "texto": "El cliente ya no lo quiere azul y en espanol. Ahora lo quiere ROJO y en INGLES. Reencaucen todo el trabajo.", "antes": "Azul · Español", "despues": "Rojo · Inglés", "hora": "22:51", "tareas": ["m1"], "memoria": true, "conversacion": true, "n_tareas": 1, "sombras": ["Jima"]}], "roster": [{"id": "igris", "n": "Igris", "r": "Copywriting", "i": "✍️", "c": "#A78BFA"}, {"id": "tank", "n": "Tank", "r": "Ventas / WhatsApp", "i": "🤝", "c": "#5BE58A"}, {"id": "greed", "n": "Greed", "r": "Ads / Tráfico", "i": "🎯", "c": "#FF9F6B"}, {"id": "iron", "n": "Iron", "r": "Email / Secuencias", "i": "📧", "c": "#67B7FF"}, {"id": "tusk", "n": "Tusk", "r": "SEO / Orgánico", "i": "🔍", "c": "#FFC24B"}, {"id": "kamish", "n": "Kamish", "r": "Social / Distribución", "i": "📣", "c": "#FF7BC1"}, {"id": "kaisel", "n": "Kaisel", "r": "Web Dev", "i": "🌐", "c": "#7CE8C0"}, {"id": "titan", "n": "Titan", "r": "UX / UI", "i": "🎨", "c": "#B7A6FF"}, {"id": "jima", "n": "Jima", "r": "Automatización", "i": "⚙️", "c": "#8FD6FF"}, {"id": "beru", "n": "Beru", "r": "Auditoría", "i": "🛡️", "c": "#FF8A8A"}], "generado": "22:51"};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('gen').textContent = D.generado;

const clase = de => de === 'monarca' ? 'mine' : (de === 'bellion' ? 'bellion' : 'sombra');
document.getElementById('rc').innerHTML = D.cambios.length ? (() => {
  const c = D.cambios[D.cambios.length - 1];
  return `<div class="rc">
    <span class="tag">⚡ Reencauce colectivo · ${esc(c.id)} · ${esc(c.hora)}</span>
    <div class="big">EL RUMBO CAMBIA EN MEDIO DEL TRABAJO</div>
    <div class="quote">"${esc(c.texto)}"</div>
    ${(c.antes || c.despues) ? `<div class="antes">
      ${c.antes ? `<span class="ao old">${esc(c.antes)}</span><span class="flech">➜</span>` : ''}
      ${c.despues ? `<span class="ao new">${esc(c.despues)}</span>` : ''}
    </div>` : ''}
    <div class="prop">
      <span class="pc">🗣 Conversación ${c.conversacion ? '<b>reenrutada</b>' : '—'}</span>
      <span class="pc">📋 Tareas ${c.tareas.length ? '<b>' + c.tareas.length + ' reasignada(s)</b>' : '—'}</span>
      <span class="pc">🧠 Memoria ${c.memoria ? '<b>grabada</b>' : '—'}</span>
    </div>
  </div>`;
})() : '';

document.getElementById('chat').innerHTML = D.mensajes.length ? D.mensajes.map(m => `
  <div class="msg ${clase(m.de)}">
    <div class="av">${esc(m.i)}</div>
    <div class="burbuja">
      <div class="cab">
        <span class="nom" style="color:${esc(m.c)}">${esc(m.n)}</span>
        <span class="rol">${esc(m.r)}</span>
        <span class="hora">${esc(m.hora)}</span>
      </div>
      <div class="txt">${esc(m.texto)}</div>
    </div>
  </div>`).join('') : '<div class="vac">La mesa está en silencio. Convoca a una sombra.</div>';

document.getElementById('mis').innerHTML = D.misiones.length ? D.misiones.map(m => `
  <div class="mi">
    <div class="top">
      <span style="font-size:20px">${esc(m.i)}</span>
      <span class="ti">${esc(m.titulo)}</span>
      <span style="font-size:11.5px;font-weight:800;color:${esc(m.c)}">${esc(m.n)}</span>
      <span style="font-size:10px;color:var(--dim)">${esc(m.r)}</span>
      <span class="pill ${m.turnos.length && m.estado !== 'abierta' ? '' : 'ok'}">${esc(m.estado)} · ${m.turnos.length} turno(s)</span>
      ${m.reencauzada ? '<span class="badge-rc">⚡ REENCAUZADA</span>' : ''}
    </div>
    ${m.turnos.map(t => `
      <div class="turno">
        <div class="num">${t.n}</div>
        <div class="cuerpo">
          <div class="ord">👑 <b>Monarca:</b> ${esc(t.instruccion)}</div>
          <div class="resp">${esc(t.salida)}</div>
        </div>
      </div>`).join('')}
    <div class="mision-btns">
      <div class="mb" data-hermes-send="Mesa: corrige en la mision ${esc(m.id)} (${esc(m.n)}) — Monarca dice: ">✍️ Corregir a ${esc(m.n)} (turno ${m.turnos.length + 1})</div>
    </div>
  </div>`).join('') : '<div class="vac">Sin misiones en curso. Aquí se verá cada misión turno por turno, y podrá corregir entre turnos.</div>';

document.getElementById('sus').innerHTML = D.susurros.length ? D.susurros.map(s => `
  <div class="sw ${s.de === 'monarca' ? '' : 'sombra'}">
    <div class="cab">
      <span class="nom" style="color:${esc(s.c)}">${esc(s.i)} ${esc(s.n)}</span>
      <span class="flecha">→ ${esc(s.pi)} ${esc(s.pn)}</span>
      <span class="hora">${esc(s.hora)}</span>
    </div>
    <div class="txt">${esc(s.texto)}</div>
  </div>`).join('') : '<div class="vac"><span class="candado">🔒 PRIVADO</span><br>Sin susurros todavía. Aquí se verá lo que hable al oído con una sombra — el resto del escuadrón no lo ve.</div>';

document.getElementById('squad').innerHTML = D.roster.map(s => `
  <div class="sh" data-hermes-send="Mesa: convoca a ${esc(s.n)} — Monarca dice: ">
    <div class="av">${esc(s.i)}</div>
    <div><div class="n" style="color:${esc(s.c)}">${esc(s.n)}</div><div class="r">${esc(s.r)}</div></div>
  </div>`).join('');

document.getElementById('foot').innerHTML =
  `<span>🐺 Seawolf Studio · Mesa de Guerra</span><span>${D.mensajes.length} mensajes</span><span>generado ${esc(D.generado)}</span>`;
</script>
</body>
</html>
